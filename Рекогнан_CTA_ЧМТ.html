<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTA после ЧМТ — цикл</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=Onest:wght@600&display=swap" rel="stylesheet">
<style>
/* Стили из ДС Рекогнана: Black #1A1F26, Blue #1A417D, Blue 2 #E6F3FF, White;
   H3 Inter Tight Medium 32/1.35, H4 24/1.5, Body Regular 18/1.6, Button Onest SemiBold 20/1.5 */
:root{color-scheme:light;--black:#1A1F26;--blue:#1A417D;--blue2:#E6F3FF;--white:#fff;
  --hurt:214,60,72;--heal:143,208,255}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--blue2);overflow-x:clip}
body{font-family:"Inter Tight",system-ui,sans-serif;color:var(--black);letter-spacing:0}

.cta{background:var(--blue2);padding:48px 24px}
.card{position:relative;max-width:1200px;margin:0 auto;padding:0 32px;border-radius:24px;
  display:grid;grid-template-columns:708px 1fr;gap:20px;align-items:center}
.text{position:relative;z-index:2;display:flex;flex-direction:column;gap:24px}
.copy{display:flex;flex-direction:column;gap:24px}
.points{display:flex;flex-direction:column;gap:16px}
.lead{font-weight:500}
h3{margin:0;font-weight:500;font-size:32px;line-height:1.35}
.lead{margin:0;font-size:18px;line-height:1.6}
.lead b,h3 b{font-weight:700}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;gap:4px;align-items:center;font-size:18px;line-height:1.6}
.ico{position:relative;flex:none;width:22px;height:22px;color:var(--blue)}
.ico svg{position:relative;display:block;width:22px;height:22px;transition:opacity .4s ease}
.ico::before{content:"";position:absolute;inset:-9px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--heal),.9),rgba(var(--heal),0) 70%);opacity:0;transform:scale(.4)}
li span{transition:color .5s ease}
/* пока мозг травмирован — пункты «ещё не сработали» */
.wait .ico svg{opacity:.2}
.wait>span:last-child{color:rgba(26,31,38,.45)}
/* вспышка, когда пункт «подтверждается» */
.lit .ico svg{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.lit .ico::before{animation:flash .9s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:.2}100%{transform:scale(1);opacity:1}}
@keyframes flash{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.5)}}

.btn{display:flex;align-items:center;justify-content:center;width:638px;max-width:100%;
  padding:16px 40px;border-radius:12px;background:var(--blue);color:var(--white);text-decoration:none;
  font:600 20px/1.5 "Onest",system-ui,sans-serif;text-align:center;
  filter:drop-shadow(0 20px 40px rgba(26,65,125,.05));transition:background .2s}
.btn:hover{background:#15356a}
.btn:focus-visible{outline:3px solid #8FD0FF;outline-offset:3px}

/* ---- мозг ---- */
.art{position:relative;height:280px;z-index:1}
.blob{position:absolute;pointer-events:none}
.blob.b1{width:397px;height:397px;left:-11px;top:-150px;transform:rotate(180deg) scaleY(-1)}
.blob.b2{width:326px;height:326px;left:96px;top:6px}
.brain{position:absolute;left:30px;top:-40px;width:380px;aspect-ratio:760/660;
  animation:float 6s ease-in-out infinite}
.brain>*{position:absolute;inset:0;width:100%;height:100%}
.brain img{display:block;transition:filter 1.6s ease}
/* «ушиб»: обесцвеченная зона + гематома, обрезаны по силуэту мозга */
.bruise{filter:grayscale(1) brightness(.72) contrast(1.15);opacity:0;transition:opacity 1.8s ease;
  -webkit-mask-image:radial-gradient(circle at 66% 22%,#000 0,#000 10%,transparent 24%);
          mask-image:radial-gradient(circle at 66% 22%,#000 0,#000 10%,transparent 24%)}
.hurt{opacity:0;mix-blend-mode:multiply;transition:opacity 1.8s ease;

.fx{overflow:visible}
.crack{fill:none;stroke:rgb(var(--hurt));stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:420;stroke-dashoffset:420;filter:drop-shadow(0 0 6px rgba(var(--hurt),.7));
  transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1),stroke 1.2s ease,opacity 1.4s ease}
.wave{fill:none;stroke:rgb(var(--heal));stroke-width:3;opacity:0}
.dot{fill:rgb(var(--heal));filter:drop-shadow(0 0 8px rgba(var(--heal),1));opacity:0}

.is-hurt .bruise,.is-hurt .hurt{opacity:1}
.is-hurt .crack{stroke-dashoffset:0}
.is-hurt .hurt{animation:throb 1.1s ease-in-out infinite}
.is-hit{animation:hit .45s linear}
.is-heal .crack{stroke:rgb(var(--heal));filter:drop-shadow(0 0 8px rgba(var(--heal),1));opacity:0;transition-delay:0s,0s,1.4s}
.is-heal .bruise,.is-heal .hurt{opacity:0;animation:none}
.is-heal .dot{opacity:1}
.is-done img{filter:drop-shadow(0 0 28px rgba(110,180,255,.55)) brightness(1.04)}

@keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes throb{0%,100%{opacity:.75}45%{opacity:1}}
@keyframes hit{0%,100%{transform:none}20%{transform:translate(-7px,3px) rotate(-1.5deg)}
  40%{transform:translate(6px,-2px) rotate(1deg)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}

/* ---- планшет ---- */
@media (max-width:1023px){
  .cta{padding:56px 24px}
  .card{grid-template-columns:1fr;padding:24px;gap:24px}
  .art{order:-1;height:300px}
  .brain{left:50%;top:0;width:340px;margin-left:-170px}
  .blob.b1{left:calc(50% - 230px);top:-90px}
  .blob.b2{left:calc(50% - 60px);top:40px}
  .btn{width:100%}
}
/* ---- мобайл ---- */
@media (max-width:600px){
  .cta{padding:32px 16px}
  .card{padding:0;gap:20px}
  .art{height:230px}
  .brain{width:260px;margin-left:-130px}
  .blob.b1{width:300px;height:300px;left:calc(50% - 175px);top:-70px}
  .blob.b2{width:240px;height:240px;left:calc(50% - 40px);top:30px}
  .text{gap:32px}
  .copy{gap:20px}
  h3{font-size:24px;line-height:1.5}
  .btn{font-size:18px;padding:16px 24px}
}
@media (prefers-reduced-motion:reduce){
  .brain{animation:none}
  .brain *,.brain{transition:none!important;animation:none!important}
}
</style>
</head>

<section class="cta">
  <div class="card">
    <div class="text">
      <div class="copy">
        <h3>Восстановление мозга после&nbsp;ЧМТ требует комплексного подхода.</h3>
        <div class="points">

          <circle class="wave" id="wave" cx="502" cy="146" r="0">
            <animate attributeName="r" from="10" to="170" dur="1.4s" begin="indefinite" fill="freeze"/>
            <animate attributeName="opacity" values="0;.8;0" dur="1.4s" begin="indefinite" fill="freeze"/>

<script>
{
  const brain = document.getElementById('brain');
  const dotsG = document.getElementById('dots');
  const wave = document.getElementById('wave');
  const icons = [...document.querySelectorAll('li')];
  const NS = 'http://www.w3.org/2000/svg';
  // пути «нейронов», которые приходят к месту травмы (502,146)
  const paths = [
    'M80 330 C220 220 380 230 500 148',
    'M720 430 C650 310 600 220 506 150',
    'M290 20 C380 20 450 70 498 140',
    'M760 110 C650 90 570 120 504 146',
    'M340 470 Q430 280 500 152',
    'M620 0 C600 60 560 110 506 142'
  ];
  const motions = paths.map((d, i) => {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('class', 'dot'); c.setAttribute('r', i % 2 ? 7 : 9);
    const m = document.createElementNS(NS, 'animateMotion');
    m.setAttribute('path', d); m.setAttribute('dur', (1.3 + i * .12) + 's');
    m.setAttribute('begin', 'indefinite'); m.setAttribute('fill', 'freeze');
    m.setAttribute('calcMode', 'spline'); m.setAttribute('keyTimes', '0;1'); m.setAttribute('keySplines', '.4 0 .2 1');
    const f = document.createElementNS(NS, 'animate');
    f.setAttribute('attributeName', 'opacity'); f.setAttribute('values', '0;1;1;0');
    f.setAttribute('keyTimes', '0;.15;.85;1'); f.setAttribute('dur', (1.3 + i * .12) + 's');
    f.setAttribute('begin', 'indefinite'); f.setAttribute('fill', 'freeze');
    c.append(m, f); dotsG.append(c);
    return [m, f];
  });

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timers = [], running = false;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function play() {
    if (reduce || running) return;
    running = true; timers.forEach(clearTimeout); timers = [];
    brain.className = 'brain';
    void brain.offsetWidth;
    // 1. удар и травма
    icons.forEach(li => { li.classList.remove('lit'); li.classList.add('wait'); });
    brain.classList.add('is-hurt', 'is-hit');
    later(() => brain.classList.remove('is-hit'), 460);
    // 2. восстановление: нейроны стягиваются к трещине
    later(() => {
      motions.forEach(([m, f], i) => setTimeout(() => { m.beginElement(); f.beginElement(); }, i * 140));
    }, 2400);
    later(() => {
      brain.classList.remove('is-hurt'); brain.classList.add('is-heal');
      wave.querySelectorAll('animate').forEach(a => a.beginElement());
    }, 3500);
    later(() => icons.forEach((li, i) => setTimeout(() => { li.classList.remove('wait'); li.classList.add('lit'); }, i * 450)), 3700);
    // 3. здоровый мозг
    later(() => { brain.classList.add('is-done'); running = false; }, 5200);
  }

  const LOOP = 9500; // удар → лечение → пауза здорового мозга → снова
  let loopTimer = null, visible = false;
  function cycle() {
    if (!visible) return;
    running = false; play();
    loopTimer = setTimeout(cycle, LOOP);
  }
  if (!reduce) {
    const io = new IntersectionObserver(es => es.forEach(e => {
      visible = e.isIntersecting;
      clearTimeout(loopTimer);
      if (visible) cycle();
    }), { threshold: .35 });
    io.observe(brain);
  } else {
    brain.classList.add('is-done');
  }
}
</script>
