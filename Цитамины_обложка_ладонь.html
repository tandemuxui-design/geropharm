  html,body{margin:0;height:100%;background:#d9d2c8;}
  body{display:flex;align-items:center;justify-content:center;font-family:'DaxlinePro','Manrope',system-ui,sans-serif;}
  .stage{position:relative;width:100vw;max-width:calc(100vh * 16 / 9);aspect-ratio:16/9;overflow:hidden;}
  svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .orbit{fill:none;stroke:#2b2622;stroke-opacity:.42;stroke-width:1.5;stroke-dasharray:6 9;animation:flow 6s linear infinite;}
  @keyframes flow{to{stroke-dashoffset:-150;}}
  .arrow{fill:none;stroke:#2b2622;stroke-opacity:.55;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .comet{fill:none;stroke-width:2;stroke-linecap:round;}
  .node{cursor:pointer;outline:none;}
  .node .ball{transform-box:fill-box;transform-origin:center;transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .6s;}
  .node .spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .node.active .ball{transform:scale(1.12);}
  .node:not(.active) .ball{filter:saturate(.85);}
  .ring{fill:none;stroke-width:1.2;}
  .ring.static{transition:opacity .6s;}
  .node:not(.active) .ring.static{opacity:.35;}
  .ripple{fill:none;stroke-width:1.4;opacity:0;transform-box:fill-box;transform-origin:center;}
  .node.active .ripple{animation:ripple 2.4s cubic-bezier(.25,.6,.3,1) infinite;}
  .node.active .ripple:nth-of-type(2){animation-delay:.8s;}
  .node.active .ripple:nth-of-type(3){animation-delay:1.6s;}
  @keyframes ripple{0%{transform:scale(.55);opacity:.75;}100%{transform:scale(2.1);opacity:0;}}
  .label text{fill:#2b2622;transition:opacity .6s;}
  .label .name{font-size:22px;font-weight:700;}
  .label .role{font-size:17px;font-weight:400;}
  .node:not(.active) .label text{opacity:.55;}
  .node.active .label .role{opacity:.8;}
  .title{font-family:'Suisse Intl','Inter',sans-serif;font-size:62px;font-weight:400;fill:#24272b;text-transform:uppercase;letter-spacing:0;}
  .zone{display:none;}
  .zoneX{opacity:0;transition:opacity 1s ease;pointer-events:none;}
  .zone.on{opacity:1;}
  .zone .glow{mix-blend-mode:soft-light;}
  .zone .lines path{fill:none;stroke-width:1.3;stroke-linecap:round;}
  .zone.on .lines:not(#lines1) path{animation:dash 3.5s linear infinite;}
  @keyframes dash{to{stroke-dashoffset:-120;}}
  #lines1 path{fill:none;stroke-linecap:round;}
  #lines1 .pulse{stroke-dasharray:90 910;stroke-dashoffset:1000;opacity:0;}
  .zone.on #lines1 .pulse{animation:pulse 2.6s cubic-bezier(.45,0,.25,1) infinite;}
  @keyframes pulse{0%{stroke-dashoffset:1000;opacity:0;}12%{opacity:1;}80%{opacity:1;}100%{stroke-dashoffset:0;opacity:0;}}
  #z1 .glow{transition:opacity 1.4s;}
  .float{}
  @keyframes bob{50%{transform:translateY(-6px);}}
  .n2 .float{animation-delay:-2s}.n3 .float{animation-delay:-4s}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

  const g=el('g',{class:`node n${i+1}`,tabindex:0,role:'button','aria-label':`${n.name} — ${n.role}`},nodesG);
  for(const [r,op] of [[48,.5],[57,.28],[66,.14]]) el('circle',{class:'ring static',cx:x,cy:y,r,stroke:n.col,'stroke-opacity':op},g);
  for(let k=0;k<3;k++) el('circle',{class:'ripple',cx:x,cy:y,r:45,stroke:n.col},g);
  const fl=el('g',{class:'float'},g);
  const ball=el('g',{class:'ball'},fl);
  el('circle',{cx:x,cy:y,r:42,fill:'transparent'},ball);
  const rg=el('g',{transform:`rotate(${n.rot||0} ${x} ${y})${n.flip?` translate(${2*x} 0) scale(-1 1)`:''}`},ball);
  const im=el('image',{class:'spin',href:n.img,x:x-41,y:y-41,width:82,height:82},rg);
  if(n.shade) el('circle',{cx:x,cy:y,r:41,fill:'url(#sphere)','pointer-events':'none'},ball);
  im.style.animationDuration=(n.spd||40)+'s'; if(n.rev) im.style.animationDirection='reverse';
  const lab=el('g',{class:'label'},g);
  const gap=n.lx||72; const below=n.side==='below', above=n.side==='above', vert=below||above; const lx=vert?x:(n.side==='left'?x-gap:x+gap), anchor=vert?'middle':(n.side==='left'?'end':'start');
  el('text',{class:'name',x:lx,y:(below?y+gap+8:above?y-gap+6:y+8)+(n.dy||0),'text-anchor':anchor},lab).textContent=n.name;
  return g;
});

// узор линий для зон
function contours(gid,cx,cy,col,count,step,sx,sy){
  const g=document.getElementById(gid);
  for(let k=0;k<count;k++){
    const r=14+k*step; let d='';
    for(let a=0;a<=360;a+=4){
      const ar=rad(a), rr=r*(1+.12*Math.sin(3*ar+k*.4)+.06*Math.sin(5*ar-k*.3));
      d+=(a?'L':'M')+(cx+rr*Math.cos(ar)*sx).toFixed(1)+' '+(cy+rr*Math.sin(ar)*sy).toFixed(1);
    }
    el('path',{d,stroke:col,'stroke-opacity':(.75-k*.04).toFixed(2),'stroke-dasharray':'60 6'},g);
  }
}
contours('lines0',1276,235,'#ffdcc0',7,9,1.3,1);
contours('lines2',1250,565,'#e9c3c6',6,9,2.7,.4);

// «дороги»: тонкие сосуды и бегущие по ним импульсы света
function smooth(pts){
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,pts.length-1)];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;
  }
  return d;
}
let vesselIdx=0;
function vessel(gid,pts,delay){
  const g=document.getElementById(gid);
  const offs=[-3.5,0,3.5];
  offs.forEach((o,j)=>{
    const sh=pts.map((p,i)=>[p[0]+o+Math.sin(i*1.7+j)*1.2, p[1]+o*.35]);
    const d=smooth(sh);
    el('path',{d,class:'vein',stroke:'#f07a6a','stroke-opacity':j===1?.45:.22,'stroke-width':j===1?1:.7},g);
    const pulse=el('path',{d,class:'pulse',pathLength:1000,stroke:'#ffc6bc','stroke-width':j===1?2:1.2,filter:'url(#glowP)'},g);
    pulse.style.animationDelay=(delay+j*.18)+'s';
  });
}
vessel('lines1',[[1135,300],[1128,400],[1095,480],[1045,505],[985,455],[935,400],[875,378],[828,368]],0);
vessel('lines1',[[1415,330],[1420,450],[1422,560],[1420,660],[1417,750]],.4);




// круги по всему телу от активного шара
const BW=document.getElementById('bodyWaves'), BW2=document.getElementById('bodyWaves2');
const NR=9, rings=[], rings2=[];
for(let k=0;k<NR;k++){ rings.push(el('circle',{fill:'none','stroke-width':6},BW)); rings2.push(el('circle',{fill:'none','stroke-width':1.1},BW2)); }
let waveT=0, waveSrc=null, waveCol=[240,133,58], waveAmp=0;
function waves(dt, act, col){
  waveT+=dt;
  const target = act!==null?1:0; waveAmp += (target-waveAmp)*Math.min(1,dt*2.5);
  if(act!==null){ const n=NODES[act]; const p=pt(n.ang); waveSrc=p; }
  if(!waveSrc) return;
  const SP=120, GAP=150, MAXR=1500;
  for(let k=0;k<NR;k++){
    const r=((waveT*SP)+k*GAP)%(NR*GAP);
    const life=r/(NR*GAP);
    const op=waveAmp*Math.sin(Math.PI*Math.min(1,life*1.15))*(1-life*0.55);
    for(const [arr,o] of [[rings,.85],[rings2,1]]){
      const c=arr[k]; c.setAttribute('cx',waveSrc[0]); c.setAttribute('cy',waveSrc[1]); c.setAttribute('r',Math.max(1,r));
      c.setAttribute('stroke',col); c.setAttribute('stroke-opacity',(op*o).toFixed(3));
    }
  }
}

// цикл каскада
const comet=document.getElementById('comet');
const zones=[0,1,2].map(i=>document.getElementById('z'+i));
let ang=-130, locked=null, target=null, resumeT=null, last=performance.now();
const SPEED=34; // град/сек
function setActive(i){
  nodeEls.forEach((g,k)=>g.classList.toggle('active',k===i));
  zones.forEach((z,k)=>z.classList.toggle('on',k===i));
}
function norm(a){return ((a%360)+360)%360;}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(locked===null){ ang+=SPEED*dt; }
  else { const t=NODES[locked].ang; let d=norm(t-ang+180)-180; ang+=d*Math.min(1,dt*4); }
  // активный узел — последний пройденный кометой
  let act=null, best=999;
  NODES.forEach((n,i)=>{const d=norm(ang-n.ang); if(d<best){best=d;act=i;}});
  if(locked!==null) act=locked; else if(best>110) act=null;
  setActive(act);
  // хвост кометы
  // цвет хвоста: плавный переход от пройденного шара к следующему
  let pi=0,ni=0,dp=999,dn=999;
  NODES.forEach((n,i)=>{const a=norm(ang-n.ang), b=norm(n.ang-ang); if(a<dp){dp=a;pi=i;} if(b<dn){dn=b;ni=i;}});
  const hx=h=>[1,3,5].map(k=>parseInt(h.substr(k,2),16));
  const c1=hx(NODES[pi].col), c2=hx(NODES[ni].col), tt=(dp+dn)?dp/(dp+dn):0;
  const col=locked!==null?NODES[locked].col:'rgb('+c1.map((v,k)=>Math.round(v+(c2[k]-v)*tt)).join(',')+')';
  const a1=ang-70, steps=24; let d='';
  for(let s=0;s<=steps;s++){const a=a1+(ang-a1)*s/steps; const [x,y]=pt(a); d+=(s?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}
  comet.setAttribute('d',d); comet.setAttribute('stroke',col);
  waves(dt, act!==null?act:pi, col);
  comet.setAttribute('stroke-opacity','.8');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

nodeEls.forEach((g,i)=>{
  const on=()=>{clearTimeout(resumeT); locked=i;};
  const off=()=>{clearTimeout(resumeT); resumeT=setTimeout(()=>{locked=null;},1200);};
  g.addEventListener('mouseenter',on); g.addEventListener('mouseleave',off);
  g.addEventListener('focus',on); g.addEventListener('blur',off);
  g.addEventListener('click',()=>{ if(locked===i){locked=null;} else on(); });
});
