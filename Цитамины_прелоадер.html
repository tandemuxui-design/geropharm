  @media (prefers-reduced-motion: reduce) {
    .stage { display:flex; align-items:center; justify-content:center; gap:16px; height:auto; }
    .ball { position:static; margin:0; animation:pulse 1.8s ease-in-out infinite; }
    .ball:nth-child(2) { animation-delay:.3s; } .ball:nth-child(3) { animation-delay:.6s; }
    @keyframes pulse { 50% { transform:scale(.88); } }
  }
</style>
</head>
<body>
  <div class="preloader" id="preloader" role="status" aria-live="polite">
    <div class="stage" aria-hidden="true">
      <div class="ball ball--supr"></div>
      <div class="ball ball--vaz"></div>
      <div class="ball ball--ovar"></div>
    </div>
    <p class="label">Загрузка<span id="dots"></span></p>
  </div>
<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dots = document.getElementById('dots'), n = 0;
  setInterval(function(){ n = (n + 1) % 4; dots.textContent = '...'.slice(0, n); }, 400);
  if (reduce) return;
  var balls = document.querySelectorAll('.ball');
  var T = 2400, H = 160, inner = 26, outer = 92;
  function pos(t){
    t = ((t % 1) + 1) % 1;
    var x, y, k;
    if (t < 0.36) { k = t / 0.36; x = inner + (-outer - inner) * k; y = -4 * H * k * (1 - k); }
    else if (t < 0.5) { k = (t - 0.36) / 0.14; x = -outer + (outer - inner) * k; y = 14 * Math.sin(Math.PI * k); }
    else if (t < 0.86) { k = (t - 0.5) / 0.36; x = -inner + (outer + inner) * k; y = -4 * H * k * (1 - k); }
    else { k = (t - 0.86) / 0.14; x = outer - (outer - inner) * k; y = 14 * Math.sin(Math.PI * k); }
    return [x, y];
  }
  function frame(now){
    for (var i = 0; i < balls.length; i++) {
      var p = pos(now / T + i / 3);
      balls[i].style.transform = 'translate(' + p[0].toFixed(1) + 'px,' + (p[1] - 6).toFixed(1) + 'px)';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
/* На сайте: снять прелоадер, когда страница загрузилась —
   window.addEventListener('load', function(){ document.getElementById('preloader').classList.add('is-done'); }); */
</script>
</body>
</html>
